[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensehome"
version = "0.1.0"
description = "Multi-sensory furniture recommender (image + sound + texture)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pydantic>=2.5"]

[project.optional-dependencies]
# Load real product photos and audio clips from disk.
media = ["Pillow>=10", "soundfile>=0.12"]
# Pretrained CLIP image embeddings.
clip = ["torch>=2.1", "transformers>=4.40", "Pillow>=10"]
# The learned two-tower model with attention fusion.
torch = ["torch>=2.1"]
dev = ["pytest>=8"]

[project.scripts]
sensehome = "sensehome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
